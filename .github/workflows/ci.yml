name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/solver/uv.lock
      - run: uv python install
        working-directory: apps/solver
      - run: npm ci
      - run: npm run check
      - name: Run Python Solver tests
        run: uv run --locked pytest
        working-directory: apps/solver

  e2e:
    name: E2E (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSKY: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare local API and D1
        run: |
          npm run cf:typegen
          npm run build --workspace=@jphack-2026/frontend
      - name: Run API E2E
        run: npm run test:e2e:api -- --workers=1 --reporter=list,html
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
